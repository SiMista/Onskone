# Reverse-proxy nginx pour Onskoné (référence — reflète la prod réelle).
#
# Architecture réelle : nginx sert le FRONTEND STATIQUE (frontend/build) et ne
# proxy vers le backend Node (:8080) QUE /api et /socket.io. (Ce n'est PAS un
# proxy-all : le middleware Express ne voit donc jamais les routes de page.)
#
# Installation :
#   sudo cp deploy/nginx-onskone.conf /etc/nginx/sites-available/onskone
#   sudo ln -s /etc/nginx/sites-available/onskone /etc/nginx/sites-enabled/onskone
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   HTTPS : sudo certbot --nginx -d onskone.fr -d www.onskone.fr
#   (certbot ajoute le bloc 443 TLS + la redirection 80 -> 443 ; en prod ces
#    parties sont marquées "managed by Certbot" et régénérées par le pipeline.)

# Upgrade WebSocket (Socket.IO) — contexte http.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name onskone.fr www.onskone.fr;

    root /home/onskone/apps/Onskone/frontend/build;
    index index.html;

    client_max_body_size 1m;

    # noindex des routes privées/éphémères. Servies en statique, donc le header
    # doit venir de nginx (le backend ne voit pas ces routes). `rewrite ... break`
    # sert index.html EN RESTANT dans la location -> le add_header est conservé
    # (un `try_files $uri /index.html` ferait une redirection interne qui LE PERD).
    location ~ ^/(admin|lobby|game|endgame|join|studio)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^ /index.html break;
    }

    # SPA : sert le fichier statique sinon index.html (fallback client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Géré par Certbot en prod (bloc TLS + redirection 80->443) ---
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/onskone.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/onskone.fr/privkey.pem;
    listen 80;
}
