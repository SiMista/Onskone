# Build + publication iOS sur TestFlight, sans Mac (Codemagic build sur leurs Mac cloud).
#
# Prerequis a configurer UNE fois dans l'interface Codemagic (pas dans ce fichier) :
#   1. Teams > Integrations > App Store Connect : ajouter la cle API Apple
#      (.p8 + Key ID + Issuer ID). Le nom de l'integration doit correspondre
#      a la valeur sous integrations.app_store_connect ci-dessous.
#   2. Creer un groupe de variables "ios_signing" contenant CERTIFICATE_PRIVATE_KEY
#      = une cle privee RSA (openssl genrsa 2048). fetch-signing-files --create
#      l'utilise pour creer un certificat de distribution reutilisable a chaque build.
#
# La plateforme iOS (frontend/ios) n'a pas besoin d'exister en local : elle est
# generee ici par `cap add ios` sur le Mac cloud.

workflows:
  ios-testflight:
    name: iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: onskone_app_store_connect

    environment:
      node: 22
      # Pas de bloc ios_signing : la signature auto Codemagic ne CREE pas les
      # profils manquants (elle echoue "No matching profiles"). On cree cert +
      # profil nous-memes via fetch-signing-files --create (cf etape signature).
      groups:
        # Groupe Codemagic contenant CERTIFICATE_PRIVATE_KEY (cle privee RSA fixe).
        # Sans cle persistante, --create ne genere pas de certificat utilisable.
        - ios_signing
      vars:
        # URL ABSOLUE du backend de prod : l'app native ne peut pas la deduire
        # de window.location (origine = capacitor://localhost). Cf getServerUrl().
        VITE_SERVER_URL: "https://onskone.fr"
        # Build natif : base d'assets relative './' (cf vite.config.ts).
        CAPACITOR_BUILD: "1"
        XCODE_PROJECT: "frontend/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # Monetisation (achats in-app via RevenueCat) : VITE_RC_APPLE_KEY (cle API
        # PUBLIQUE Apple, prefixe "appl_") vient du groupe `ios_signing` importe
        # ci-dessus, deja exporte dans l'environnement du build (Vite lit
        # process.env.VITE_*). NE PAS la redeclarer ici sous la forme
        # `VITE_RC_APPLE_KEY: $VITE_RC_APPLE_KEY` : Codemagic ne documente pas
        # l'expansion d'une auto-reference dans `vars`, qui peut ecraser la vraie
        # valeur par du vide ou par le texte litteral (achats morts dans l'IPA).
        # L'etape "Verifier la cle RevenueCat Apple" controle la valeur recue.
        # Prerequis Apple (a faire UNE fois, hors CI) : cocher la capability
        # "In-App Purchase" sur l'App ID com.onskone.app dans le portail Apple.
        # StoreKit ne demande PAS de cle dans App.entitlements (contrairement aux
        # Associated Domains), il suffit que la capability soit active sur l'App ID.

    scripts:
      - name: Installer pnpm
        # --force : l'image Codemagic a deja pnpm/pnpx, sans ca npm plante (EEXIST).
        script: npm install -g pnpm@9 --force

      - name: Installer les dependances
        script: pnpm install

      - name: Verifier la cle RevenueCat Apple
        # Echoue si VITE_RC_APPLE_KEY est vide ou mal formee : sinon l'IPA part
        # sur TestFlight avec des achats morts (erreur sur chaque bouton du paywall).
        script: node scripts/check-rc-key.mjs ios

      - name: Restaurer l'historique git complet
        # Codemagic clone en superficiel (--depth) : `git rev-list --count HEAD`
        # ne voit qu'une fraction de l'historique (57 au lieu de 166) et le
        # versionCode peut RECULER d'un build a l'autre. Google/Apple refusent
        # definitivement un numero deja utilise -> on restaure l'historique complet.
        # AVANT le build web : Vite y fige __APP_VERSION__, annoncee au serveur pour
        # la maj forcee (sinon le JS embarque mentirait sur la version du store).
        script: git fetch --unshallow 2>/dev/null || git fetch --depth=100000 || true

      - name: Build shared (types) puis frontend
        script: |
          pnpm build:shared
          pnpm build:frontend

      - name: Generer + synchroniser la plateforme iOS
        script: |
          cd frontend
          if [ ! -d ios ]; then pnpm exec cap add ios; fi
          # iOS est regenere a neuf a chaque build : il faut (re)generer les icones
          # + splash depuis frontend/assets/ sinon on garde l'icone Capacitor par defaut.
          pnpm exec capacitor-assets generate --ios
          pnpm exec cap sync ios

      - name: Injecter l'entitlement Associated Domains (Universal Links)
        # Le projet iOS est regenere a chaque build : l'entitlement applinks ne
        # persiste pas, on le (re)cree ici. Prerequis : la capability "Associated
        # Domains" doit etre cochee sur l'App ID com.onskone.app chez Apple (sinon
        # le provisioning profile ne l'aura pas et la signature echouera).
        script: |
          set -e
          ENT="frontend/ios/App/App/App.entitlements"
          cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.associated-domains</key>
            <array>
              <string>applinks:onskone.fr</string>
            </array>
          </dict>
          </plist>
          PLIST
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj
          # Branche le fichier d'entitlements sur le target "App" (toutes les configs).
          # CODE_SIGN_ENTITLEMENTS est relatif au dossier du .xcodeproj (frontend/ios/App).
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("frontend/ios/App/App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" }
            abort("target App introuvable") unless target
            target.build_configurations.each do |c|
              c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
            end
            project.save
            puts "CODE_SIGN_ENTITLEMENTS=App/App.entitlements applique au target App"
          '

      - name: Declarer l'export compliance (chiffrement exempte)
        # L'app n'utilise que du chiffrement standard (HTTPS/WSS) => exempte des
        # regles d'export US. Sans cette cle, TestFlight refuse le build avec
        # "The build is missing export compliance". Le projet iOS etant regenere
        # a chaque build, on (re)ecrit la cle dans l'Info.plist ici.
        script: |
          set -e
          PLIST="frontend/ios/App/App/Info.plist"
          plutil -replace ITSAppUsesNonExemptEncryption -bool false "$PLIST"
          echo "ITSAppUsesNonExemptEncryption=false injecte dans $PLIST"

      - name: Injecter la config AdMob (Info.plist)
        # Pubs AdMob (cf. frontend/src/utils/ads.ts). Projet iOS regenere a chaque
        # build : on (re)ecrit les cles ici.
        #  - GADApplicationIdentifier : App ID iOS (avec ~, PAS un ID de bloc). Sans
        #    lui, le SDK Google Mobile Ads crashe au lancement.
        #  - SKAdNetworkItems : Google + acheteurs tiers, liste officielle de
        #    https://developers.google.com/admob/ios/quick-start (verifiee le 16/10/2026).
        #  - NSUserTrackingUsageDescription : texte de la popup ATT d'Apple. FR + EN
        #    dans une seule chaine : pas d'InfoPlist.strings dans ce projet regenere.
        script: |
          set -e
          PLIST="frontend/ios/App/App/Info.plist"
          plutil -replace GADApplicationIdentifier -string "ca-app-pub-1213483210041504~2912110467" "$PLIST"
          SKAD_IDS="cstr6suwn9 4fzdc2evr5 2fnua5tdw4 ydx93a7ass p78axxw29g v72qych5uu ludvb6z3bs cp8zw746q7 3sh42y64q3 c6k4g5qg8m s39g8k73mm wg4vff78zm 3qy4746246 f38h382jlk hs6bdukanm mlmmfzh3r3 v4nxqhlyqp wzmmz9fp6w su67r6k2v3 yclnxrl5pm t38b2kh725 7ug5zh24hu gta9lk7p23 vutu7akeur y5ghdn5j9k v9wttpbfk9 n38lu8286q 47vhws6wlr kbd757ywx3 9t245vhmpl a2p9lx4jpn 22mmun2rn5 44jx6755aq k674qkevps 4468km3ulz 2u9pt9hc89 8s468mfl3y klf5c3l5u5 ppxm28t8ap kbmxgpxpgc uw77j35x4d 578prtvx9j 4dzt52r2t5 tl55sbb4fm c3frkrj4fj e5fvkxwrpn 8c4e2ghe7u 3rd42ekr43 97r2b46745 3qcr597p9d"
          JSON="["
          for id in $SKAD_IDS; do JSON="$JSON{\"SKAdNetworkIdentifier\":\"$id.skadnetwork\"},"; done
          JSON="${JSON%,}]"
          plutil -replace SKAdNetworkItems -json "$JSON" "$PLIST"
          plutil -replace NSUserTrackingUsageDescription -string "Cet identifiant permet de vous montrer des publicités plus pertinentes. / This identifier is used to show you more relevant ads." "$PLIST"
          plutil -lint "$PLIST"
          echo "Config AdMob injectee dans $PLIST ($(echo $SKAD_IDS | wc -w | tr -d ' ') SKAdNetwork)"

      - name: Injecter la version (source unique = scripts/app-version.mjs)
        script: |
          set -e
          # Historique complet deja restaure (etape "Restaurer l'historique git complet").
          VNAME=$(node scripts/app-version.mjs)
          VCODE=$(node scripts/app-version.mjs --code)
          echo "Version $VNAME (build $VCODE)"
          cd frontend/ios/App
          agvtool new-marketing-version "$VNAME"
          agvtool new-version -all "$VCODE"

      - name: Generer / recuperer la signature puis l'appliquer
        script: |
          keychain initialize
          # --create cree le certificat de distribution + sa cle privee + le
          # provisioning profile s'ils n'existent pas. IMPORTANT : si un certificat
          # de distribution existe deja chez Apple sans sa cle privee (orphelin),
          # le supprimer dans le portail Apple avant, sinon --create ne recree rien.
          app-store-connect fetch-signing-files "com.onskone.app" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          echo "--- profils provisioning telecharges ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          # --project explicite : le glob par defaut ne descend pas dans frontend/ios/...
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Construire l'IPA
        script: |
          # Diagnostic : doit afficher PROVISIONING_PROFILE_SPECIFIER + DEVELOPMENT_TEAM
          # une fois la signature appliquee.
          echo "--- reglages de signature du target App ---"
          xcodebuild -project "$XCODE_PROJECT" -showBuildSettings 2>/dev/null \
            | grep -E "PROVISIONING_PROFILE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER" \
            | sort -u || true
          echo "-------------------------------------------"
          # Capacitor 8 = SPM, pas de App.xcworkspace CocoaPods : on build le projet.
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Envoie automatiquement le build sur TestFlight apres compilation.
        submit_to_testflight: true

  # ---------------------------------------------------------------------------
  # Build + publication Android sur la piste "internal" du Play Store.
  #
  # Prerequis a configurer UNE fois dans l'interface Codemagic (pas ici) :
  #   1. Code signing identities > Android keystores : uploader upload-keystore.jks
  #      avec le reference name "onskone_upload" (= la valeur sous android_signing).
  #      Alias de la cle : "upload".
  #   2. Environment variables : GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
  #      = le contenu ENTIER du JSON du compte de service Google Cloud,
  #      dans le groupe "ios_signing", coche Secure.
  #      Le compte de service doit etre invite dans la Play Console avec les
  #      droits "Publier sur les canaux de test" + "Afficher les informations".
  #
  # instance_type mac_mini_m2 : c'est la SEULE machine accessible sans facturation
  # activee (500 min/mois offertes). linux_x2 serait moins cher/plus rapide pour de
  # l'Android mais exige un plan payant -> "instance type is not available with the
  # current billing plan". Un Mac build tres bien de l'Android (Gradle + JDK).
  # Contrairement a iOS, frontend/android EST commite : pas de `cap add android`.
  android-play:
    name: Android - Play Store (internal)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 22
      java: 21
      android_signing:
        # Reference name du keystore uploade dans Codemagic (cf prerequis 1).
        - onskone_upload
      groups:
        # Contient GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS (cf prerequis 2).
        # Le nom dit "ios" mais l'interface Codemagic impose de choisir un groupe
        # existant : on reutilise celui-la faute de pouvoir en creer un "google_play".
        # Effet de bord inoffensif : CERTIFICATE_PRIVATE_KEY (cle iOS) est aussi
        # injectee ici, inutilisee par le build Android.
        - ios_signing
      vars:
        # URL ABSOLUE du backend de prod : l'app native ne peut pas la deduire
        # de window.location (origine = https://localhost). Cf getServerUrl().
        VITE_SERVER_URL: "https://onskone.fr"
        # Build natif : base d'assets relative './' (cf vite.config.ts).
        CAPACITOR_BUILD: "1"
        # VITE_RC_GOOGLE_KEY (cle API PUBLIQUE RevenueCat Google, prefixe "goog_")
        # vient du groupe importe ci-dessus : ne pas la redeclarer ici en
        # auto-reference (cf commentaire du workflow iOS). Controlee par l'etape
        # "Verifier la cle RevenueCat Google".

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Installer pnpm
        # --force : l'image Codemagic a deja pnpm/pnpx, sans ca npm plante (EEXIST).
        script: npm install -g pnpm@9 --force

      - name: Installer les dependances
        script: pnpm install

      - name: Verifier la cle RevenueCat Google
        script: node scripts/check-rc-key.mjs android

      - name: Restaurer l'historique git complet
        # Meme raison que le workflow iOS : versionCode ET __APP_VERSION__ (fige par
        # Vite au build web) comptent des commits -> historique complet AVANT le build.
        script: git fetch --unshallow 2>/dev/null || git fetch --depth=100000 || true

      - name: Build shared (types) puis frontend
        script: |
          pnpm build:shared
          pnpm build:frontend

      - name: Synchroniser la plateforme Android
        script: |
          cd frontend
          # frontend/android est commite : on ne fait QUE copier le build web dedans.
          # Les icones/splash sont deja generees et versionnees (contrairement a iOS
          # qui est recree a neuf a chaque build).
          pnpm exec cap sync android

      - name: Construire l'AAB signe
        # Meme mecanique que scripts/release-aab.sh, mais la signature vient du
        # keystore Codemagic (pas de keystore.properties ici) : Codemagic ecrit
        # /tmp/keystore.properties et expose les valeurs, on les passe en -P.
        # versionName/versionCode = source unique scripts/app-version.mjs.
        script: |
          set -e
          # Historique complet deja restaure (etape "Restaurer l'historique git complet").
          VNAME=$(node scripts/app-version.mjs)
          VCODE=$(node scripts/app-version.mjs --code)
          echo "Version $VNAME (build $VCODE)"
          cd frontend/android
          # Ceinture : le bit +x est versionne (100755) mais un `cap sync` ou un
          # checkout depuis Windows peut le perdre -> "./gradlew: Permission denied".
          chmod +x gradlew
          # Garde-fou : sans CM_KEYSTORE_PATH, build.gradle signe en DEBUG et
          # l'AAB n'est rejete qu'a la publication, 10 min plus tard
          # ("The Android App Bundle was signed with the wrong key").
          # Mieux vaut echouer ici, avant de compiler.
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERREUR: CM_KEYSTORE_PATH vide."
            echo "Le keystore 'onskone_upload' n'est pas attache au workflow"
            echo "(cf environment.android_signing et Code signing identities)."
            exit 1
          fi
          ./gradlew bundleRelease \
            -PappVersionName="$VNAME" \
            -PappVersionCode="$VCODE"

    artifacts:
      - frontend/android/app/build/outputs/bundle/**/*.aab
      - frontend/android/app/build/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        # Piste "Test interne" : invisible du public, dispo en quelques minutes.
        # Passer a "production" quand le flux est rode.
        track: internal
        # false = la version est publiee sur la piste, pas laissee en brouillon.
        submit_as_draft: false
